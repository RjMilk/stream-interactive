<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Overlay</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; font-family: "Segoe UI", Arial, sans-serif; }
  #root { position: fixed; inset: 0; pointer-events: none; }
  .layer { position: absolute; inset: 0; transition: opacity .8s; }
  .layer.out { opacity: 0; }

  /* banner */
  .banner { position: absolute; left: 50%; top: 50%; width: 72vw; transform: translate(-50%, -50%); text-align: center; color: #fff;
    padding: 4vh 3vw; border-radius: 3vw; background: linear-gradient(135deg, rgba(255,40,120,.92), rgba(120,40,255,.92));
    box-shadow: 0 0 6vw rgba(255,0,140,.7); animation: pop .6s cubic-bezier(.2,1.6,.4,1), wobble 1.2s ease-in-out .6s infinite; }
  .banner .t { font-size: 4.5vw; font-weight: 900; letter-spacing: .1em; }
  .banner .u { font-size: 7vw; font-weight: 900; line-height: 1.05; text-shadow: 0 .4vw 0 rgba(0,0,0,.35); word-break: break-word; }
  .banner .a { font-size: 9vw; font-weight: 900; color: #ffe94a; text-shadow: 0 .5vw 0 rgba(0,0,0,.4); }
  .banner .m { font-size: 2.6vw; margin-top: 1vh; opacity: .95; }
  @keyframes pop { from { transform: translate(-50%, -50%) scale(.1) rotate(-20deg); } }
  @keyframes wobble { 50% { transform: translate(-50%, -50%) scale(1.04) rotate(1.5deg); } }

  /* crosshair blocker */
  .cross { position: absolute; left: 50%; top: 50%; font-size: 48vmin; line-height: 1; transform: translate(-50%, -50%);
    animation: bob .5s ease-in-out infinite alternate; filter: drop-shadow(0 0 3vmin rgba(0,0,0,.6)); }
  .cross small { display: block; font-size: 4vmin; text-align: center; color: #fff; font-weight: 800; text-shadow: 0 0 1vmin #000; }
  @keyframes bob { from { transform: translate(-52%, -50%) rotate(-6deg); } to { transform: translate(-48%, -46%) rotate(6deg); } }

  /* smoke */
  .puff { position: absolute; border-radius: 50%; filter: blur(4vmin);
    background: radial-gradient(circle, rgba(200,200,200,.97) 0%, rgba(160,160,160,.9) 50%, rgba(130,130,130,0) 72%);
    animation: drift linear infinite alternate; }
  @keyframes drift { to { transform: translate(var(--dx), var(--dy)) scale(1.25); } }

  /* flashbang */
  .flash { position: absolute; inset: 0; background: #fff; }

  /* ink */
  .ink { position: absolute; animation: splat .25s ease-out, drip var(--drip) linear .3s forwards; }
  @keyframes splat { from { transform: scale(0); } }
  @keyframes drip { to { transform: translateY(18vh); } }

  /* rain */
  .drop { position: absolute; top: -15vh; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(130vh) rotate(var(--r)); } }

  /* toast: подпись к действию в игре */
  .toast { position: absolute; left: 50%; top: 9vh; transform: translateX(-50%); padding: 1.6vh 3vw; border-radius: 99px; white-space: nowrap;
    background: rgba(15,15,25,.88); border: .3vmin solid #ff2f86; color: #fff; font-size: 4vmin; font-weight: 800;
    box-shadow: 0 0 4vmin rgba(255,47,134,.6); animation: drop .45s cubic-bezier(.2,1.5,.4,1); }
  @keyframes drop { from { transform: translate(-50%, -20vh); } }

  /* screenfx: живая картинка экрана с фильтром */
  .fx { background: #000; overflow: hidden; }
  .fx video, .fx canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; }
  .fx.flip video { transform: rotate(180deg); }
  .fx.mirror video { transform: scaleX(-1); }
  .fx.gray video { filter: grayscale(1) contrast(1.15); }
  .fx.invert video { filter: invert(1) hue-rotate(180deg); }
  .fx.blur video { filter: blur(1.4vmin); transform: scale(1.04); }
  .fx.zoom video { transform: scale(2.2); }
  .fx.tiny video { transform: scale(.3); animation: roam 6s ease-in-out infinite alternate; }
  .fx.drunk video { animation: drunk 5s ease-in-out infinite; }
  @keyframes roam { from { transform: translate(-30vw, -28vh) scale(.3); } to { transform: translate(30vw, 28vh) scale(.3); } }
  @keyframes drunk {
    0%, 100% { transform: scale(1.12) rotate(-4deg) translate(-2vw, 1vh); filter: blur(.25vmin) hue-rotate(0deg); }
    33% { transform: scale(1.2) rotate(5deg) translate(3vw, -2vh); filter: blur(.7vmin) hue-rotate(40deg); }
    66% { transform: scale(1.1) rotate(-2deg) translate(1vw, 3vh); filter: blur(.4vmin) hue-rotate(-30deg); }
  }
  .badge { position: absolute; left: 50%; bottom: 5vh; transform: translateX(-50%); padding: 1.2vh 2.5vw; border-radius: 99px;
    background: rgba(255,47,134,.92); color: #fff; font-size: 3.4vmin; font-weight: 800; white-space: nowrap; }

  /* exercise: экран закрыт до выполнения упражнения */
  .ex-cover { background: #07070c; }
  .ex { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.5vh; color: #fff; text-align: center; }
  .ex-t { font-size: 7vmin; font-weight: 900; letter-spacing: .08em; color: #ff2f86; }
  .ex-n { font-size: 16vmin; font-weight: 900; line-height: 1; }
  .ex-n b { color: #ffe94a; }
  .ex-cam { height: 42vh; border-radius: 2vmin; border: .4vmin solid #ff2f86; background: #111; }
  .ex-h { font-size: 4.5vmin; font-weight: 800; min-height: 6vmin; }
  .ex-u { font-size: 2.6vmin; opacity: .7; }
  .ex-debt { position: fixed; left: 2vw; bottom: 3vh; padding: 1vh 1.6vw; border-radius: 99px; background: rgba(15,15,25,.88);
    border: .25vmin solid #ffe94a; color: #fff; font-size: 2.6vmin; font-weight: 800; display: none; }

  .who { position: absolute; left: 50%; bottom: 6vh; transform: translateX(-50%); color: #fff; font-size: 3.5vmin; font-weight: 800;
    text-shadow: 0 0 1vmin #000, 0 0 2vmin #000; white-space: nowrap; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const params = new URLSearchParams(location.search);
const MODE = params.get('mode') || 'screen';          // screen = поверх игры у стримера, obs = браузерный источник
const SOUND = MODE === 'screen' || params.get('sound') === '1';
const root = document.getElementById('root');
const layers = new Set();
const rnd = (a, b) => a + Math.random() * (b - a);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function layer(duration, fade = true) {
  const el = document.createElement('div');
  el.className = 'layer';
  root.appendChild(el);
  layers.add(el);
  el._timers = [];
  el._timers.push(setTimeout(() => el.classList.add('out'), duration * 1000 - (fade ? 800 : 0)));
  el._timers.push(setTimeout(() => remove(el), duration * 1000));
  return el;
}
function remove(el) {
  el._timers.forEach(clearTimeout);
  if (el._raf) cancelAnimationFrame(el._raf);
  if (el._cleanup) el._cleanup();
  el.remove();
  layers.delete(el);
}
const who = (ev) => ev.user ? `<div class="who">от ${esc(ev.user)}</div>` : '';

const FX_NAMES = { flip: '🙃 Экран перевёрнут', mirror: '🪞 Экран отзеркален', gray: '⬛ Чёрно-белый экран', invert: '🌗 Цвета наизнанку',
  blur: '🫥 Экран размыт', zoom: '🔍 Экран приближен', tiny: '🤏 Экран уменьшен', drunk: '🥴 Пьяный экран', freeze: '🧊 Экран завис' };
const capture = (on) => fetch('/api/capture', { method: 'POST', body: JSON.stringify({ on }) }).then((r) => r.json());

const EFFECTS = {
  toast(p) {
    const el = layer(p.duration || 5);
    el.innerHTML = `<div class="toast">${esc(p.text)}</div>`;
  },

  // Живая картинка экрана с фильтром: переворот, зеркало, ч/б и т. д.
  // Работает только в окне поверх игры; в источнике OBS показывается подпись.
  async screenfx(p, ev) {
    const d = p.duration || 15;
    const el = layer(d, false);
    const name = `${FX_NAMES[p.mode] || p.mode}${ev.user ? ' — ' + ev.user : ''}`;
    if (MODE !== 'screen') { el.innerHTML = `<div class="badge">${esc(name)} (у стримера)</div>`; return; }

    let stream = null, released = false;
    const release = () => {
      if (released) return;
      released = true;
      if (stream) stream.getTracks().forEach((t) => t.stop());
      capture(false);
    };
    el._cleanup = release;
    try {
      const { sourceId, width, height } = await capture(true);
      stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { mandatory: {
        chromeMediaSource: 'desktop', chromeMediaSourceId: sourceId, maxWidth: width, maxHeight: height, maxFrameRate: 60 } } });
      if (!layers.has(el)) return release();
      const video = document.createElement('video');
      video.muted = true;
      video.srcObject = stream;
      await video.play();
      el.classList.add('fx', p.mode);
      if (p.mode === 'freeze') {
        // Один кадр и стоп: дальше оверлей снова виден в записи, зрители тоже видят «зависание»
        const c = document.createElement('canvas');
        c.width = video.videoWidth; c.height = video.videoHeight;
        c.getContext('2d').drawImage(video, 0, 0);
        el.appendChild(c);
        release();
      } else {
        el.appendChild(video);
      }
      el.insertAdjacentHTML('beforeend', `<div class="badge">${esc(name)}</div>`);
    } catch (e) {
      console.error('screenfx', e);
      release();
      remove(el);
    }
  },

  banner(p, ev) {
    const el = layer(p.duration || 5);
    const title = p.title || (ev.type === 'follow' ? '❤️ ФОЛЛОУ' : '💸 ДОНАТ');
    const amount = ev.amount ? `${ev.amount} ${ev.currency === 'RUB' || !ev.currency ? '₽' : esc(ev.currency)}` : '';
    el.innerHTML = `<div class="banner"><div class="t">${esc(title)}</div><div class="u">${esc(ev.user)}</div>
      ${amount ? `<div class="a">${amount}</div>` : ''}${ev.message ? `<div class="m">${esc(ev.message)}</div>` : ''}</div>`;
  },

  // Огромный предмет прямо на месте прицела
  crosshair(p, ev) {
    const el = layer(p.duration || 10);
    el.innerHTML = `<div class="cross">${esc(p.emoji || '🐔')}<small>${esc(ev.user || '')}</small></div>`;
  },

  smoke(p, ev) {
    const el = layer(p.duration || 15);
    for (let i = 0; i < (p.count || 28); i++) {
      const s = rnd(45, 85);
      const puff = document.createElement('div');
      puff.className = 'puff';
      Object.assign(puff.style, { width: s + 'vmin', height: s + 'vmin', left: rnd(-20, 90) + 'vw', top: rnd(-25, 85) + 'vh',
        animationDuration: rnd(4, 9) + 's', opacity: 0, transition: `opacity ${rnd(.5, 2)}s` });
      puff.style.setProperty('--dx', rnd(-15, 15) + 'vw');
      puff.style.setProperty('--dy', rnd(-10, 10) + 'vh');
      el.appendChild(puff);
      requestAnimationFrame(() => requestAnimationFrame(() => (puff.style.opacity = 1)));
    }
    el.insertAdjacentHTML('beforeend', who(ev));
  },

  // Белый экран, который медленно отпускает
  flashbang(p, ev) {
    const d = p.duration || 7;
    const el = layer(d, false);
    const f = document.createElement('div');
    f.className = 'flash';
    el.appendChild(f);
    f.animate([{ opacity: 1 }, { opacity: 1, offset: .35 }, { opacity: .85, offset: .6 }, { opacity: 0 }], { duration: d * 1000, easing: 'ease-in', fill: 'forwards' });
  },

  // Темнота с маленьким «окошком», которое гуляет по экрану
  tunnel(p, ev) {
    const el = layer(p.duration || 20);
    const r = p.radius || 13;
    let x = 50, y = 50, tx = 50, ty = 50, t0 = 0;
    const step = (t) => {
      if (t - t0 > 1400) { t0 = t; tx = rnd(10, 90); ty = rnd(10, 90); }
      x += (tx - x) * 0.02; y += (ty - y) * 0.02;
      el.style.background = `radial-gradient(circle at ${x}% ${y}%, transparent 0, transparent ${r}vmin, rgba(0,0,0,.97) ${r + 4}vmin)`;
      el._raf = requestAnimationFrame(step);
    };
    el._raf = requestAnimationFrame(step);
    el.insertAdjacentHTML('beforeend', who(ev));
  },

  ink(p, ev) {
    const el = layer(p.duration || 12);
    for (let i = 0; i < (p.count || 9); i++) {
      const size = rnd(22, 48);
      const blobs = Array.from({ length: 14 }, () => {
        const a = rnd(0, Math.PI * 2), d = rnd(0, 34);
        return `<circle cx="${50 + Math.cos(a) * d}" cy="${50 + Math.sin(a) * d}" r="${rnd(6, 20)}"/>`;
      }).join('');
      const s = document.createElement('div');
      s.className = 'ink';
      s.style.cssText = `left:${rnd(5, 75)}vw;top:${rnd(0, 65)}vh;width:${size}vmin;height:${size}vmin;--drip:${p.duration || 12}s;animation-delay:${i * 0.12}s`;
      s.innerHTML = `<svg viewBox="0 0 100 100" width="100%" height="100%"><g fill="${p.color || '#0b0b12'}">
        <circle cx="50" cy="50" r="30"/>${blobs}</g></svg>`;
      el.appendChild(s);
    }
    el.insertAdjacentHTML('beforeend', who(ev));
  },

  // Разбитое стекло
  cracks(p, ev) {
    const el = layer(p.duration || 15);
    const W = innerWidth, H = innerHeight;
    let lines = '';
    for (let h = 0; h < (p.hits || 3); h++) {
      const cx = rnd(.2, .8) * W, cy = rnd(.2, .8) * H;
      for (let i = 0; i < 18; i++) {
        let a = (i / 18) * Math.PI * 2 + rnd(-.15, .15), x = cx, y = cy, pts = `${x},${y}`;
        for (let k = 0; k < 7; k++) {
          a += rnd(-.35, .35); const len = rnd(40, 140);
          x += Math.cos(a) * len; y += Math.sin(a) * len; pts += ` ${x},${y}`;
        }
        lines += `<polyline points="${pts}"/>`;
      }
      for (let ring = 1; ring <= 3; ring++) {
        let pts = '';
        for (let i = 0; i <= 18; i++) { const a = (i / 18) * Math.PI * 2, rr = ring * 55 + rnd(-15, 15); pts += ` ${cx + Math.cos(a) * rr},${cy + Math.sin(a) * rr}`; }
        lines += `<polyline points="${pts}"/>`;
      }
      lines += `<circle cx="${cx}" cy="${cy}" r="22" fill="rgba(255,255,255,.5)"/>`;
    }
    el.innerHTML = `<svg width="${W}" height="${H}" style="position:absolute;inset:0;background:rgba(180,200,220,.12)">
      <g fill="none" stroke="rgba(255,255,255,.9)" stroke-width="2.5" style="filter:drop-shadow(0 0 2px #000)">${lines}</g></svg>` + who(ev);
  },

  rain(p, ev) {
    const d = p.duration || 6;
    const el = layer(d);
    for (let i = 0; i < (p.count || 50); i++) {
      const s = document.createElement('div');
      s.className = 'drop';
      s.textContent = p.emoji || '💸';
      s.style.cssText = `left:${rnd(0, 97)}vw;font-size:${rnd(4, 11)}vmin;animation-duration:${rnd(1.5, Math.max(2, d - 1))}s;animation-delay:${rnd(0, d / 2)}s;--r:${rnd(-360, 360)}deg`;
      el.appendChild(s);
    }
  },
};

// n — множитель из правила (сумма / per), его считает движок
function play(effect, ev, n) {
  const fn = EFFECTS[effect.type];
  if (!fn) return console.warn('Неизвестный эффект', effect.type);
  if (effect.sound && SOUND) new Audio('/sounds/' + effect.sound).play().catch(() => {});
  fn(effect, ev || {}, n || 1);
}
window.__debug = { layers, EFFECTS };

function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = (m) => {
    const msg = JSON.parse(m.data);
    if (msg.kind === 'effect') play(msg.effect, msg.ev, msg.n);
    if (msg.kind === 'clear') [...layers].forEach(remove);
    if (msg.kind === 'exercise' || msg.kind === 'exstate') onExerciseMessage(msg);
  };
  ws.onclose = () => setTimeout(connect, 1500);
}
</script>
<script src="/exercise.js"></script>
<script>connect();</script>
</body>
</html>
